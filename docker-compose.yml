services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: order_mock_payment
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d order_mock_payment"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: migrate/migrate:v4.17.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    command:
      - -path=/migrations
      - -database=postgres://app:app@postgres:5432/order_mock_payment?sslmode=disable
      - up
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: dev
    environment:
      APP_ENV: production
      HTTP_PORT: "8080"
      LOG_LEVEL: info
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: order_mock_payment
      POSTGRES_SSLMODE: disable
      REDIS_ADDR: redis:6379
      JWT_SECRET: dev-jwt-secret-do-not-use-in-prod-please-change-me
      JWT_TTL: 24h
      WEBHOOK_SECRET: dev-webhook-secret-do-not-use-in-prod-please-change
      UPLOAD_BASE_DIR: /app/uploads
      UPLOAD_MAX_SIZE: "5242880"
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  redis_data:
  uploads_data:
